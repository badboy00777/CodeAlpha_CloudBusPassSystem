{% extends "base.html" %}
{% block title %}Login - Cloud Bus Pass{% endblock %}
{% block content %}
<h1>Login or create an account</h1>
<div id="msg" class="hidden" role="status"></div>
<div class="grid">
    <section class="card">
        <h2>Login</h2>
        <form id="login-form">
            <div class="field">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" autocomplete="username" maxlength="120" required>
            </div>
            <div class="field">
                <label for="login-password">Password</label>
                <input id="login-password" type="password" autocomplete="current-password" maxlength="72" required>
            </div>
            <button class="btn" type="submit" id="login-btn">Login</button>
        </form>
    </section>
    <section class="card">
        <h2>Create account</h2>
        <form id="register-form">
            <div class="field">
                <label for="reg-name">Full name</label>
                <input id="reg-name" type="text" autocomplete="name" maxlength="80" required>
            </div>
            <div class="field">
                <label for="reg-email">Email</label>
                <input id="reg-email" type="email" autocomplete="email" maxlength="120" required>
            </div>
            <div class="field">
                <label for="reg-phone">Phone (optional)</label>
                <input id="reg-phone" type="tel" autocomplete="tel" maxlength="15" placeholder="+923001234567">
                <div class="hint">Stored encrypted with AES-256.</div>
            </div>
            <div class="field">
                <label for="reg-password">Password</label>
                <input id="reg-password" type="password" autocomplete="new-password" maxlength="72" required>
                <div class="hint">At least 8 characters, with letters and numbers.</div>
            </div>
            <button class="btn" type="submit" id="reg-btn">Register and login</button>
        </form>
    </section>
</div>
{% endblock %}
{% block script %}
<script>
    (function () {
        const msg = document.getElementById('msg');
        function goNext(user) {
            window.location.href = user.role === 'conductor' ? '/conductor' : '/book';
        }
        async function doLogin(email, password) {
            return api('POST', '/api/login', { email: email, password: password });
        }
        document.getElementById('login-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const button = document.getElementById('login-btn');
            button.disabled = true;
            hideMsg(msg);
            const r = await doLogin(
                document.getElementById('login-email').value.trim(),
                document.getElementById('login-password').value
            );
            button.disabled = false;
            if (r.status === 200) { goNext(r.data.user); return; }
            say(msg, 'err', r.data.error || 'Login failed.');
        });
        document.getElementById('register-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const button = document.getElementById('reg-btn');
            button.disabled = true;
            hideMsg(msg);
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const body = {
                full_name: document.getElementById('reg-name').value.trim(),
                email: email,
                password: password,
                phone: document.getElementById('reg-phone').value.trim()
            };
            const r = await api('POST', '/api/register', body);
            if (r.status !== 201) {
                button.disabled = false;
                say(msg, 'err', r.data.error || 'Registration failed.');
                return;
            }
            const l = await doLogin(email, password);
            button.disabled = false;
            if (l.status === 200) { goNext(l.data.user); return; }
            say(msg, 'info', 'Account created. Please login on the left.');
        });
    })();
</script>
{% endblock %}
