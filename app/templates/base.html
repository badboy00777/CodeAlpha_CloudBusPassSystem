<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cloud Bus Pass{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="nav">
        <div class="nav-inner">
            <a class="brand" href="/">Cloud Bus Pass</a>
            <nav class="links">
                <a href="/">Fares</a>
                <a href="/book">Book a pass</a>
                <a href="/tickets">My tickets</a>
                <a href="/conductor" id="nav-conductor" class="hidden">Conductor</a>
            </nav>
            <div class="who">
                <span id="nav-user" class="muted"></span>
                <a href="/login" id="nav-login" class="btn btn-small">Login</a>
                <button type="button" id="nav-logout" class="btn btn-small btn-secondary hidden">Logout</button>
            </div>
        </div>
    </header>
    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
    <script>
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) { node.className = className; }
            if (text !== undefined && text !== null) { node.textContent = text; }
            return node;
        }
        function clear(node) {
            while (node.firstChild) { node.removeChild(node.firstChild); }
        }
        function show(node, visible) {
            node.classList.toggle('hidden', !visible);
        }
        function say(box, kind, text) {
            box.className = 'msg msg-' + kind;
            box.textContent = text;
        }
        function hideMsg(box) {
            box.className = 'hidden';
            box.textContent = '';
        }
        function localDate(offsetDays) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return d.getFullYear() + '-' + m + '-' + day;
        }
        function newKey() {
            const bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            return Array.from(bytes, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        }
        async function api(method, path, body) {
            const options = { method: method, headers: {}, credentials: 'same-origin' };
            if (body !== undefined) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }
            try {
                const response = await fetch(path, options);
                let data = {};
                try { data = await response.json(); } catch (e) { data = {}; }
                return { status: response.status, data: data };
            } catch (e) {
                return { status: 0, data: { error: 'Network problem. Please try again.' } };
            }
        }
        const meReady = api('GET', '/api/me').then(function (r) {
            const user = r.status === 200 ? r.data.user : null;
            show(document.getElementById('nav-login'), !user);
            show(document.getElementById('nav-logout'), !!user);
            show(document.getElementById('nav-conductor'), !!user && user.role === 'conductor');
            document.getElementById('nav-user').textContent = user ? user.full_name : '';
            return user;
        });
        document.getElementById('nav-logout').addEventListener('click', async function () {
            await api('POST', '/api/logout', {});
            window.location.href = '/login';
        });
        function requireLogin(callback) {
            meReady.then(function (user) {
                if (!user) { window.location.href = '/login'; return; }
                callback(user);
            });
        }
        function renderTicket(b) {
            const card = el('article', 'ticket');
            const head = el('div', 'ticket-head');
            head.appendChild(el('strong', '', b.route_code + ': ' + b.origin + ' to ' + b.destination));
            head.appendChild(el('span', 'badge badge-' + b.status, b.status));
            card.appendChild(head);
            const facts = el('dl', 'facts');
            const rows = [
                ['Pass', b.pass_type + (b.concession !== 'none' ? ' (' + b.concession + ')' : '')],
                ['Valid', b.travel_date + ' to ' + b.valid_until],
                ['Price paid', 'PKR ' + b.price_pkr],
                ['Booking ID', '#' + b.id]
            ];
            rows.forEach(function (row) {
                facts.appendChild(el('dt', '', row[0]));
                facts.appendChild(el('dd', '', row[1]));
            });
            card.appendChild(facts);
            card.appendChild(el('div', 'label', 'Ticket code (show this to the conductor)'));
            const code = el('div', 'code', b.ticket_code);
            card.appendChild(code);
            const copy = el('button', 'btn btn-small btn-secondary', 'Copy code');
            copy.type = 'button';
            copy.addEventListener('click', async function () {
                try {
                    await navigator.clipboard.writeText(b.ticket_code);
                    copy.textContent = 'Copied';
                } catch (e) {
                    const range = document.createRange();
                    range.selectNodeContents(code);
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                    copy.textContent = 'Selected: press Ctrl+C';
                }
            });
            card.appendChild(copy);
            return card;
        }
    </script>
    {% block script %}{% endblock %}
</body>

</html>
